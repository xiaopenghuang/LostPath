[pytest]
testpaths = tests
# 默认排除 integration：它要起真引擎子进程并全盘扫 C 盘，约 40s。
# 快测试全过才有必要付那个代价。跑完整套件：
#   python -m pytest -m "integration or not integration"
# 只跑集成：
#   python -m pytest -m integration
addopts = -m "not integration"
markers =
    integration: 起真引擎子进程 + 真全盘扫描，慢（约 40s），默认不跑
    real_env_lookup: 退出 conftest 对 envvar.effective_var 的打桩，用于测该函数自身。
        仍不碰真注册表——用例自己打桩 get_user_var / get_machine_var
